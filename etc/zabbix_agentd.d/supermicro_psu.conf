# Supermicro PSU energy monitoring - UserParameter definitions.
# Installed by packaging/install.sh into Zabbix agent(d)'s include directory
# (commonly /etc/zabbix/zabbix_agentd.d/). Scripts live under
# /usr/lib/zabbix-supermicro-psu/ - adjust PSU_BIN_DIR below if you install
# elsewhere.

UserParameter=supermicro.psu.discovery[*],/usr/lib/zabbix-supermicro-psu/psu_discover.py "$1"
UserParameter=supermicro.psu.energy[*],/usr/lib/zabbix-supermicro-psu/psu_read_energy.py --bus "$1" --addr "$2"
UserParameter=supermicro.psu.status[*],/usr/lib/zabbix-supermicro-psu/psu_read_status.py --bus "$1" --addr "$2"
